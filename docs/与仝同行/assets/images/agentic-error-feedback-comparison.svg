<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="636" viewBox="0 0 1200 636" role="img" aria-labelledby="title desc">
<title id="title">反馈组织</title><desc id="desc">三项独立错误的示意比较。逐次报错需要多次运行才能发现全部问题；聚合可在一次检查中发现 A、B、C，再修复验证。交付层按主因、相关项、摘要和查询组织。非实测数据。</desc>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2457C5"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#268362"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#C94B48"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#60728A"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#BB641F"/></marker>
</defs>
<g font-family="&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Noto Sans CJK SC&#x27;,Arial,sans-serif">
<rect x="1" y="1" width="1198" height="634" rx="20" fill="#FFFFFF" stroke="#CEDBEC" stroke-width="1.5"/>
<text x="38" y="39" font-size="15" fill="#2457C5" font-weight="600" text-anchor="start">
<tspan x="38" dy="0">FEEDBACK ECONOMICS</tspan>
</text>
<text x="38" y="80" font-size="29" fill="#162B48" font-weight="650" text-anchor="start">
<tspan x="38" dy="0">反馈组织</tspan>
</text>
<path d="M38 102 L1162 102" stroke="#CEDBEC" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="147" font-size="17" fill="#60728A" font-weight="400" text-anchor="start">
<tspan x="44" dy="0">发现 → 修改 → 再执行的轮次示意</tspan>
</text>
<text x="44" y="198" font-size="23" fill="#C94B48" font-weight="650" text-anchor="start">
<tspan x="44" dy="0">逐次发现</tspan>
</text>
<path d="M215 230 L1126 230" stroke="#CEDBEC" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-line)"/>
<circle cx="254" cy="230" r="12" fill="#FFF0EE" stroke="#C94B48" stroke-width="2"/>
<text x="254" y="199" font-size="20" fill="#162B48" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="254" dy="0">run 1</tspan>
</text>
<text x="254" y="270" font-size="19" fill="#C94B48" font-weight="400" text-anchor="middle">
<tspan x="254" dy="0">发现 A</tspan>
</text>
<circle cx="461" cy="230" r="12" fill="#FFF0EE" stroke="#C94B48" stroke-width="2"/>
<text x="461" y="199" font-size="20" fill="#162B48" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="461" dy="0">fix A</tspan>
</text>
<text x="461" y="270" font-size="19" fill="#C94B48" font-weight="400" text-anchor="middle">
<tspan x="461" dy="0">修改</tspan>
</text>
<circle cx="668" cy="230" r="12" fill="#FFF0EE" stroke="#C94B48" stroke-width="2"/>
<text x="668" y="199" font-size="20" fill="#162B48" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="668" dy="0">run 2</tspan>
</text>
<text x="668" y="270" font-size="19" fill="#C94B48" font-weight="400" text-anchor="middle">
<tspan x="668" dy="0">发现 B</tspan>
</text>
<circle cx="875" cy="230" r="12" fill="#FFF0EE" stroke="#C94B48" stroke-width="2"/>
<text x="875" y="199" font-size="20" fill="#162B48" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="875" dy="0">fix B</tspan>
</text>
<text x="875" y="270" font-size="19" fill="#C94B48" font-weight="400" text-anchor="middle">
<tspan x="875" dy="0">修改</tspan>
</text>
<circle cx="1082" cy="230" r="12" fill="#FFF0EE" stroke="#C94B48" stroke-width="2"/>
<text x="1082" y="199" font-size="20" fill="#162B48" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="1082" dy="0">run 3</tspan>
</text>
<text x="1082" y="270" font-size="19" fill="#C94B48" font-weight="400" text-anchor="middle">
<tspan x="1082" dy="0">发现 C</tspan>
</text>
<text x="44" y="343" font-size="23" fill="#268362" font-weight="650" text-anchor="start">
<tspan x="44" dy="0">聚合反馈</tspan>
</text>
<path d="M215 373 L1126 373" stroke="#CEDBEC" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-line)"/>
<circle cx="254" cy="373" r="12" fill="#EDF8F2" stroke="#268362" stroke-width="2"/>
<text x="254" y="342" font-size="20" fill="#162B48" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="254" dy="0">run 1</tspan>
</text>
<text x="254" y="413" font-size="19" fill="#268362" font-weight="400" text-anchor="middle">
<tspan x="254" dy="0">发现 A + B + C</tspan>
</text>
<circle cx="668" cy="373" r="12" fill="#EDF8F2" stroke="#268362" stroke-width="2"/>
<text x="668" y="342" font-size="20" fill="#162B48" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="668" dy="0">repair</tspan>
</text>
<text x="668" y="413" font-size="19" fill="#268362" font-weight="400" text-anchor="middle">
<tspan x="668" dy="0">计划并修复</tspan>
</text>
<circle cx="1082" cy="373" r="12" fill="#EDF8F2" stroke="#268362" stroke-width="2"/>
<text x="1082" y="342" font-size="20" fill="#162B48" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="1082" dy="0">verify</tspan>
</text>
<text x="1082" y="413" font-size="19" fill="#268362" font-weight="400" text-anchor="middle">
<tspan x="1082" dy="0">检查修改结果</tspan>
</text>
<path d="M43 452 L1156 452" stroke="#CEDBEC" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="43" y="492" font-size="21" fill="#2457C5" font-weight="650" text-anchor="start">
<tspan x="43" dy="0">交付策略</tspan>
</text>
<rect x="226" y="476" width="215" height="100" rx="9" fill="#EEF4FF" stroke="none" stroke-width="1.5"/>
<text x="244" y="510" font-size="17" fill="#2457C5" font-weight="650" text-anchor="start">
<tspan x="244" dy="0">PRIMARY</tspan>
</text>
<text x="244" y="549" font-size="21" fill="#162B48" font-weight="400" text-anchor="start">
<tspan x="244" dy="0">优先主错误</tspan>
</text>
<rect x="460" y="476" width="215" height="100" rx="9" fill="#EEF4FF" stroke="none" stroke-width="1.5"/>
<text x="478" y="510" font-size="17" fill="#2457C5" font-weight="650" text-anchor="start">
<tspan x="478" dy="0">RELATED</tspan>
</text>
<text x="478" y="549" font-size="21" fill="#162B48" font-weight="400" text-anchor="start">
<tspan x="478" dy="0">关联派生项</tspan>
</text>
<rect x="694" y="476" width="215" height="100" rx="9" fill="#EDF8F2" stroke="none" stroke-width="1.5"/>
<text x="712" y="510" font-size="17" fill="#268362" font-weight="650" text-anchor="start">
<tspan x="712" dy="0">SUMMARY</tspan>
</text>
<text x="712" y="549" font-size="21" fill="#162B48" font-weight="400" text-anchor="start">
<tspan x="712" dy="0">按规则摘要</tspan>
</text>
<rect x="928" y="476" width="215" height="100" rx="9" fill="#EDF8F2" stroke="none" stroke-width="1.5"/>
<text x="946" y="510" font-size="17" fill="#268362" font-weight="650" text-anchor="start">
<tspan x="946" dy="0">QUERY</tspan>
</text>
<text x="946" y="549" font-size="21" fill="#162B48" font-weight="400" text-anchor="start">
<tspan x="946" dy="0">按需取详情</tspan>
</text>
<text x="44" y="611" font-size="18" fill="#60728A" font-weight="400" text-anchor="start">
<tspan x="44" dy="0">仅在可安全继续分析时聚合；相关错误不等于独立修复目标。</tspan>
</text>
</g></svg>
