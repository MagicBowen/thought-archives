<tspan x="664" dy="0">0</tspan>
</text>
<circle cx="854" cy="377" r="18" fill="#EDF8F2" stroke="#268362" stroke-width="2"/>
<text x="854" y="384" font-size="19" fill="#268362" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="854" dy="0">0</tspan>
</text>
<circle cx="1044" cy="377" r="18" fill="#EDF8F2" stroke="#268362" stroke-width="2"/>
<text x="1044" y="384" font-size="19" fill="#268362" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="1044" dy="0">0</tspan>
</text>
<rect x="241" y="410" width="883" height="28" rx="4" fill="#EDF8F2" stroke="none" stroke-width="1.5"/>
<text x="262" y="431" font-size="18" fill="#268362" font-weight="400" text-anchor="start" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="262" dy="0">Origin / source span</tspan>
</text>
<circle cx="664" cy="425" r="4" fill="#268362" stroke="none" stroke-width="2"/>
<circle cx="854" cy="425" r="4" fill="#268362" stroke="none" stroke-width="2"/>
<circle cx="1044" cy="425" r="4" fill="#268362" stroke="none" stroke-width="2"/>
<rect x="241" y="444" width="883" height="28" rx="4" fill="#EDF8F2" stroke="none" stroke-width="1.5"/>
<text x="262" y="465" font-size="18" fill="#268362" font-weight="400" text-anchor="start" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
