<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="606" viewBox="0 0 1200 606" role="img" aria-labelledby="title desc">
<title id="title">来源传播</title><desc id="desc">Parse、Transform、Buffer、Replay、Validate 五阶段。仅传递值时来源可能丢失；保留来源引用和路径可在失败处关联原始输入。示意模型。</desc>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2457C5"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#268362"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#C94B48"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#60728A"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#BB641F"/></marker>
</defs>
<g font-family="&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Noto Sans CJK SC&#x27;,Arial,sans-serif">
<rect x="1" y="1" width="1198" height="604" rx="20" fill="#FFFFFF" stroke="#CEDBEC" stroke-width="1.5"/>
<text x="38" y="39" font-size="15" fill="#2457C5" font-weight="600" text-anchor="start">
<tspan x="38" dy="0">PROVENANCE LANES</tspan>
</text>
<text x="38" y="80" font-size="29" fill="#162B48" font-weight="650" text-anchor="start">
<tspan x="38" dy="0">来源传播</tspan>
</text>
<path d="M38 102 L1162 102" stroke="#CEDBEC" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="579" y="121" width="369" height="402" rx="12" fill="#FFF5E9" stroke="none" stroke-width="1.5"/>
<text x="765" y="148" font-size="17" fill="#BB641F" font-weight="600" text-anchor="middle">
<tspan x="765" dy="0">缓冲 / 回放边界</tspan>
</text>
<text x="284" y="193" font-size="22" fill="#162B48" font-weight="650" text-anchor="middle">
<tspan x="284" dy="0">Parse</tspan>
</text>
<path d="M284 211 L284 502" stroke="#CEDBEC" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="474" y="193" font-size="22" fill="#162B48" font-weight="650" text-anchor="middle">
<tspan x="474" dy="0">Transform</tspan>
</text>
<path d="M474 211 L474 502" stroke="#CEDBEC" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="664" y="193" font-size="22" fill="#162B48" font-weight="650" text-anchor="middle">
<tspan x="664" dy="0">Buffer</tspan>
</text>
<path d="M664 211 L664 502" stroke="#CEDBEC" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="854" y="193" font-size="22" fill="#162B48" font-weight="650" text-anchor="middle">
<tspan x="854" dy="0">Replay</tspan>
</text>
<path d="M854 211 L854 502" stroke="#CEDBEC" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="1044" y="193" font-size="22" fill="#162B48" font-weight="650" text-anchor="middle">
<tspan x="1044" dy="0">Validate</tspan>
</text>
