<text x="854" y="269" font-size="19" fill="#C94B48" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="854" dy="0">0</tspan>
</text>
<circle cx="1044" cy="262" r="18" fill="#FFF0EE" stroke="#C94B48" stroke-width="2"/>
<text x="1044" y="269" font-size="19" fill="#C94B48" font-weight="600" text-anchor="middle" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
<tspan x="1044" dy="0">0</tspan>
</text>
<text x="980" y="316" font-size="17" fill="#C94B48" font-weight="400" text-anchor="start" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">
