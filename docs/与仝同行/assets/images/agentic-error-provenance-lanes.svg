<circle cx="664" cy="459" r="4" fill="#268362" stroke="none" stroke-width="2"/>
<circle cx="854" cy="459" r="4" fill="#268362" stroke="none" stroke-width="2"/>
<circle cx="1044" cy="459" r="4" fill="#268362" stroke="none" stroke-width="2"/>
<text x="42" y="558" font-size="19" fill="#60728A" font-weight="400" text-anchor="start">
<tspan x="42" dy="0">保留方式可以是引用或事件元数据；图中的带状区域不表示传递完整上下文。</tspan>
