<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="736" viewBox="0 0 1200 736" role="img" aria-labelledby="title desc">
<title id="title">诊断运行时</title><desc id="desc">生产者层产生原生错误和来源。诊断层组织 Provenance、Diagnosis、Recovery。统一 Diagnostic IR 交付给 CLI、IDE、CI、Agent。本文建议架构。</desc>
<defs>
